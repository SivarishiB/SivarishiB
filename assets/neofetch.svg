<style>
  .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
  .a { font-size: 9px; fill: #5eead4; white-space: pre; opacity: 0; animation: rowIn .5s ease-out forwards; }
  .t { font-size: 14px; fill: #d6e2ee; opacity: 0; animation: rowIn .35s ease-out forwards; white-space: pre; }
  .k { fill: #5eead4; font-weight: 700; }
  .h { fill: #f472b6; font-weight: 700; }
  .d { fill: #5b6b7c; }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  .scan { animation: scan 4.5s linear 3.2s infinite; opacity: 0; }
  @keyframes scan { 0% { transform: translateY(0); opacity: .0; } 5% { opacity: .55; } 95% { opacity: .55; } 100% { transform: translateY(513.0px); opacity: 0; } }
  .glitch { animation: glitch 6s steps(1) 4s infinite; }
  @keyframes glitch { 0%,100% { transform: none; } 92% { transform: translateX(3px); } 93% { transform: translateX(-4px); } 94% { transform: none; } }
  .cursor { animation: blink 1s steps(1) infinite; fill: #5eead4; }
  @keyframes blink { 50% { opacity: 0; } }
  .sw { opacity: 0; animation: rowIn .3s ease-out forwards; }
</style>
